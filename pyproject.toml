[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orr-overpotential-calculator"
version = "0.3.0"
description = "Calculator for ORR overpotential"
requires-python = ">=3.12"
dependencies = [
    "ase-calculator-kit>=0.5.3",
    "matplotlib",
    "pandas",
    "torch-dftd",
    "ase",
    "pyqt5",
    "pyyaml",
]

[project.optional-dependencies]
fairchem = ["ase-calculator-kit[uma]>=0.5.3"]
sevenn = ["ase-calculator-kit[sevennet]>=0.5.3"]
mace = ["ase-calculator-kit[mace]>=0.5.3"]
cueq12 = [
    "cuequivariance>=0.6.0; python_version >= '3.10'",
    "cuequivariance-torch>=0.6.0; python_version >= '3.10'",
    "cuequivariance-ops-torch-cu12; python_version >= '3.10'"
]
cueq13 = [
    "cuequivariance>=0.7.0; python_version >= '3.10'",
    "cuequivariance-torch>=0.7.0; python_version >= '3.10'",
    "cuequivariance-ops-torch-cu13; python_version >= '3.10'"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
